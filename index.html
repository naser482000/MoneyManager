<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت مالی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif}
body{background:#0f172a;color:#f1f5f9;min-height:100vh;direction:rtl}
#login{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:20px}
#login h1{font-size:60px;margin-bottom:10px}
#login h2{color:#0ea5e9;margin-bottom:30px;font-size:20px}
.inp{width:100%;max-width:320px;padding:12px;margin-bottom:10px;background:#1e293b;color:#fff;border:1px solid #334155;border-radius:10px;font-size:15px}
.btn{width:100%;max-width:320px;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:bold;color:#fff;cursor:pointer;margin-bottom:8px;font-family:inherit}
.b1{background:#1e40af}.b2{background:#0ea5e9}.b3{background:#22c55e}.b4{background:#ef4444}.b5{background:#f59e0b}
#app{display:none;min-height:100vh;padding-bottom:80px}
.hd{background:#1e40af;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.hd b{font-size:16px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #334155;display:flex;z-index:10}
.nav div{flex:1;text-align:center;padding:10px 4px;color:#94a3b8;font-size:11px;cursor:pointer}
.nav div.on{color:#0ea5e9}
.nav div span{display:block;font-size:22px;margin-bottom:2px}
.pg{display:none;padding:16px}
.pg.on{display:block}
.card{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #334155}
.card h3{font-size:14px;margin-bottom:10px;color:#0ea5e9}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #334155;font-size:13px}
.row:last-child{border:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:#1e293b;border-radius:12px;padding:12px}
.stat small{color:#94a3b8;font-size:10px}
.stat b{display:block;font-size:18px;margin-top:4px}
.inc{color:#22c55e}.exp{color:#ef4444}.net{color:#0ea5e9}
.tx{background:#1e293b;border-radius:10px;padding:10px;margin-bottom:8px;border-right:3px solid #0ea5e9;font-size:13px}
.tx.i{border-color:#22c55e}.tx.e{border-color:#ef4444}
.tx .t1{display:flex;justify-content:space-between;margin-bottom:4px}
.tx .t2{color:#94a3b8;font-size:11px}
label{display:block;font-size:12px;color:#94a3b8;margin-bottom:4px;margin-top:8px}
input,select{width:100%;padding:10px;background:#334155;color:#fff;border:1px solid #334155;border-radius:8px;font-family:inherit;font-size:14px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
#md.on{display:flex}
#mc{background:#1e293b;border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto}
#mc h3{margin-bottom:14px;font-size:16px}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:12px 20px;border-radius:10px;font-weight:bold;opacity:0;transition:opacity .3s;z-index:200;pointer-events:none;font-size:13px}
#toast.on{opacity:1}
#toast.err{background:#ef4444}
.empty{text-align:center;padding:30px;color:#64748b;font-size:13px}
</style>
</head>
<body>

<div id="login">
<h1>💰</h1>
<h2>مدیریت مالی</h2>
<input class="inp" id="lu" value="admin" placeholder="نام کاربری">
<input class="inp" id="lp" type="password" value="admin" placeholder="رمز">
<button class="btn b1" onclick="login()">🔓 ورود</button>
<button class="btn" style="background:#334155" onclick="newUser()">➕ کاربر جدید</button>
<div style="margin-top:30px;color:#64748b;font-size:12px" id="ld"></div>
</div>

<div id="app">
<div class="hd">
<div><b>💰 مدیریت مالی</b><div style="font-size:12px;opacity:.9" id="hu"></div></div>
<button class="btn" style="width:40px;max-width:40px;background:rgba(255,255,255,.15);padding:8px" onclick="openSync()">☁️</button>
</div>

<div class="pg on" id="pg-dash">
<div style="color:#0ea5e9;font-size:13px;margin-bottom:12px" id="td"></div>
<div class="g2">
<div class="stat"><small>📥 درآمد ماه</small><b class="inc" id="di">0</b></div>
<div class="stat"><small>📤 هزینه ماه</small><b class="exp" id="de">0</b></div>
<div class="stat" style="grid-column:span 2"><small>💰 مانده ماه</small><b class="net" id="dn">0</b></div>
</div>
<div class="card"><h3>🏦 موجودی حساب‌ها</h3><div id="da"><div class="empty">حسابی نداری</div></div></div>
<div class="card"><h3>📊 کل</h3>
<div class="row"><span>کل درآمد</span><b class="inc" id="ti">0</b></div>
<div class="row"><span>کل هزینه</span><b class="exp" id="te">0</b></div>
<div class="row"><span>مانده کل</span><b class="net" id="tn">0</b></div>
<div class="row"><span>تعداد تراکنش</span><b id="tc">0</b></div>
</div>
</div>

<div class="pg" id="pg-tx">
<button class="btn b3" onclick="addTx()" style="max-width:100%;margin-bottom:12px">➕ ثبت تراکنش</button>
<div id="txl"></div>
</div>

<div class="pg" id="pg-rem">
<button class="btn b3" onclick="addRem()" style="max-width:100%;margin-bottom:12px">➕ افزودن یادآور</button>
<div id="reml"></div>
</div>

<div class="pg" id="pg-set">
<div class="card"><h3>🏦 حساب‌ها</h3>
<button class="btn b2" onclick="addAcc()" style="max-width:100%;margin-bottom:8px">➕ حساب جدید</button>
<div id="acl"></div>
</div>
<div class="card"><h3>📥 منابع درآمد</h3>
<button class="btn b2" onclick="addSrc()" style="max-width:100%;margin-bottom:8px">➕ منبع جدید</button>
<div id="scl"></div>
</div>
<div class="card"><h3>📤 دسته‌ها</h3>
<button class="btn b2" onclick="addCat()" style="max-width:100%;margin-bottom:8px">➕ دسته جدید</button>
<div id="ccl"></div>
</div>
<div class="card"><h3>💾 داده‌ها</h3>
<button class="btn b3" onclick="expData()" style="max-width:100%;margin-bottom:8px">📥 دانلود بکاپ</button>
<button class="btn b5" onclick="impData()" style="max-width:100%;margin-bottom:8px">⬆️ بارگذاری</button>
<button class="btn b4" onclick="clrData()" style="max-width:100%">🗑️ پاک کردن همه</button>
</div>
<div class="card"><h3>👤 کاربر</h3>
<div style="margin-bottom:10px;font-size:13px" id="su"></div>
<button class="btn b4" onclick="logout()">🚪 خروج</button>
</div>
</div>

<div class="nav">
<div class="on" onclick="go('dash',this)"><span>📊</span>داشبورد</div>
<div onclick="go('tx',this)"><span>💳</span>تراکنش</div>
<div onclick="go('rem',this)"><span>🔔</span>یادآور</div>
<div onclick="go('set',this)"><span>⚙️</span>تنظیمات</div>
</div>
</div>

<div id="md" onclick="if(event.target.id==='md')closeM()"><div id="mc"></div></div>
<div id="toast"></div>

<script>
var DB={key:'mm_db_v1',data:null};
DB.def=function(){return{
users:[{id:1,username:'admin',password:'admin',fullName:'مدیر'}],
accounts:[{id:1,name:'بانک ملت',currency:'IRT',initial:5000000}],
sources:[{id:1,name:'حقوق'},{id:2,name:'فریلنس'}],
categories:[{id:1,name:'خوراک'},{id:2,name:'حمل ونقل'},{id:3,name:'قبض'},{id:4,name:'خرید'}],
transactions:[],reminders:[],currentUser:null,
nid:{tx:1,rem:1,acc:2,src:3,cat:5,user:2}
};};
DB.load=function(){try{var s=localStorage.getItem(this.key);this.data=s?JSON.parse(s):this.def();}catch(e){this.data=this.def();}};
DB.save=function(){try{localStorage.setItem(this.key,JSON.stringify(this.data));}catch(e){}};

var J={
g2j:function(gy,gm,gd){var dm=[0,31,59,90,120,151,181,212,243,273,304,334];var g2=gm>2?gy+1:gy;var d=355666+365*gy+Math.floor((g2+3)/4)-Math.floor((g2+99)/100)+Math.floor((g2+399)/400)+gd+dm[gm-1];var jy=-1595+33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365;}var jm,jd;if(d<186){jm=1+Math.floor(d/31);jd=1+d%31;}else{jm=7+Math.floor((d-186)/30);jd=1+(d-186)%30;}return[jy,jm,jd];},
j2g:function(jy,jm,jd){jy+=1595;var d=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd;if(jm<7)d+=(jm-1)*31;else d+=(jm-7)*30+186;var gy=400*Math.floor(d/146097);d%=146097;if(d>36524){d--;gy+=100*Math.floor(d/36524);d%=36524;if(d>=365)d++;}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365;}var gd=d+1;var sa=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];var gm=0;while(gm<13&&gd>sa[gm]){gd-=sa[gm];gm++;}return[gy,gm,gd];},
today:function(){var t=new Date();return this.g2j(t.getFullYear(),t.getMonth()+1,t.getDate());},
todayStr:function(){var t=this.today();return t[0]+'/'+p2(t[1])+'/'+p2(t[2]);},
toJ:function(s){try{var a=s.split('-').map(Number);var j=this.g2j(a[0],a[1],a[2]);return j[0]+'/'+p2(j[1])+'/'+p2(j[2]);}catch(e){return s;}},
toG:function(s){try{var a=s.replace(/-/g,'/').split('/').map(Number);var g=this.j2g(a[0],a[1],a[2]);return g[0]+'-'+p2(g[1])+'-'+p2(g[2]);}catch(e){return s;}},
mname:function(m){var n=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];return n[m-1]||'';},
full:function(){var t=this.today();return t[2]+' '+this.mname(t[1])+' '+t[0];},
monthR:function(){var t=this.today();var g1=this.j2g(t[0],t[1],1);var nj=t[1]+1,ny=t[0];if(nj>12){nj=1;ny++;}var g2=this.j2g(ny,nj,1);var e=new Date(g2[0],g2[1]-1,g2[2]);e.setDate(e.getDate()-1);return[g1[0]+'-'+p2(g1[1])+'-'+p2(g1[2]),e.getFullYear()+'-'+p2(e.getMonth()+1)+'-'+p2(e.getDate())];}
};
function p2(n){return String(n).padStart(2,'0');}
function fmt(n){return n?Math.round(n).toLocaleString('en-US'):'0';}
function toast(m,e){var t=document.getElementById('toast');t.textContent=m;t.className=e?'on err':'on';setTimeout(function(){t.className='';},2500);}
function openM(h){document.getElementById('mc').innerHTML=h;document.getElementById('md').classList.add('on');}
function closeM(){document.getElementById('md').classList.remove('on');}

function login(){
var u=document.getElementById('lu').value.trim();
var p=document.getElementById('lp').value.trim();
var user=DB.data.users.find(function(x){return x.username===u&&x.password===p;});
if(!user){toast('نام یا رمز اشتباه',true);return;}
DB.data.currentUser=user;DB.save();
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='block';
document.getElementById('hu').textContent=user.fullName;
document.getElementById('su').textContent=user.fullName;
refresh();
}
function logout(){if(!confirm('خارج می‌شوی؟'))return;DB.data.currentUser=null;DB.save();location.reload();}
function newUser(){
openM('<h3>➕ کاربر جدید</h3>'+
'<label>نام کاربری</label><input id="nu">'+
'<label>رمز</label><input id="np" type="password">'+
'<label>نام کامل</label><input id="nn">'+
'<button class="btn b3" style="max-width:100%;margin-top:14px" onclick="saveUser()">💾 ذخیره</button>');
}
function saveUser(){
var u=document.getElementById('nu').value.trim();
var p=document.getElementById('np').value.trim();
var n=document.getElementById('nn').value.trim()||u;
if(!u||!p){toast('نام و رمز لازم',true);return;}
if(DB.data.users.find(function(x){return x.username===u;})){toast('تکراری',true);return;}
DB.data.users.push({id:DB.data.nid.user++,username:u,password:p,fullName:n});
DB.save();closeM();toast('✅ کاربر ساخته شد');
}

function go(n,el){
var ps=document.querySelectorAll('.pg');
for(var i=0;i<ps.length;i++)ps[i].classList.remove('on');
document.getElementById('pg-'+n).classList.add('on');
var ns=document.querySelectorAll('.nav div');
for(var i=0;i<ns.length;i++)ns[i].classList.remove('on');
el.classList.add('on');
if(n==='dash')rDash();
if(n==='tx')rTx();
if(n==='rem')rRem();
if(n==='set')rSet();
}

function rDash(){
document.getElementById('td').textContent='🗓️ '+J.full();
var r=J.monthR();
var mt=DB.data.transactions.filter(function(t){return t.date>=r[0]&&t.date<=r[1];});
var inc=mt.filter(function(t){return t.type==='income';}).reduce(function(s,t){return s+t.amount;},0);
var exp=mt.filter(function(t){return t.type==='expense';}).reduce(function(s,t){return s+t.amount;},0);
document.getElementById('di').textContent=fmt(inc);
document.getElementById('de').textContent=fmt(exp);
document.getElementById('dn').textContent=fmt(inc-exp);
var da=document.getElementById('da');
if(!DB.data.accounts.length){da.innerHTML='<div class="empty">حسابی نداری</div>';}
else{
da.innerHTML=DB.data.accounts.map(function(a){
var i=DB.data.transactions.filter(function(t){return t.type==='income'&&t.accountId===a.id;}).reduce(function(s,t){return s+t.amount;},0);
var e=DB.data.transactions.filter(function(t){return t.type==='expense'&&t.accountId===a.id;}).reduce(function(s,t){return s+t.amount;},0);
var b=a.initial+i-e;
return'<div class="row"><span>'+a.name+'</span><b class="'+(b>=0?'inc':'exp')+'">'+fmt(b)+' '+a.currency+'</b></div>';
}).join('');
}
var ai=DB.data.transactions.filter(function(t){return t.type==='income';}).reduce(function(s,t){return s+t.amount;},0);
var ae=DB.data.transactions.filter(function(t){return t.type==='expense';}).reduce(function(s,t){return s+t.amount;},0);
document.getElementById('ti').textContent=fmt(ai);
document.getElementById('te').textContent=fmt(ae);
document.getElementById('tn').textContent=fmt(ai-ae);
document.getElementById('tc').textContent=DB.data.transactions.length;
}

function rTx(){
var txs=DB.data.transactions.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
var el=document.getElementById('txl');
if(!txs.length){el.innerHTML='<div class="empty">تراکنشی نداری</div>';return;}
var tm={income:'📥 درآمد',expense:'📤 هزینه',transfer:'🔄'};
el.innerHTML=txs.slice(0,50).map(function(t){
var a=DB.data.accounts.find(function(x){return x.id===t.accountId;});
var s=DB.data.sources.find(function(x){return x.id===t.sourceId;});
var c=DB.data.categories.find(function(x){return x.id===t.categoryId;});
var ex=(s&&s.name)||(c&&c.name)||'—';
return'<div class="tx '+(t.type==='income'?'i':t.type==='expense'?'e':'')+'">'+
'<div class="t1"><b class="'+(t.type==='income'?'inc':'exp')+'">'+fmt(t.amount)+' '+t.currency+'</b><span>'+J.toJ(t.date)+'</span></div>'+
'<div class="t2">'+tm[t.type]+' | '+(a?a.name:'—')+' | '+ex+'</div>'+
'<button class="btn b4" style="max-width:100%;padding:6px;font-size:11px;margin-top:6px" onclick="delTx('+t.id+')">🗑️ حذف</button>'+
'</div>';
}).join('');
}

function addTx(){
if(!DB.data.accounts.length){toast('اول حساب بساز',true);return;}
var ao=DB.data.accounts.map(function(a){return'<option value="'+a.id+'">'+a.name+'</option>';}).join('');
var so=DB.data.sources.map(function(s){return'<option value="'+s.id+'">'+s.name+'</option>';}).join('');
var co=DB.data.categories.map(function(c){return'<option value="'+c.id+'">'+c.name+'</option>';}).join('');
openM('<h3>➕ تراکنش جدید</h3>'+
'<label>نوع</label><select id="tt" onchange="toggleF()"><option value="income">📥 درآمد</option><option value="expense">📤 هزینه</option></select>'+
'<label>مبلغ</label><input id="ta" type="number" inputmode="numeric">'+
'<label>ارز</label><select id="tc"><option>IRT</option><option>IRR</option><option>USD</option><option>EUR</option></select>'+
'<label>حساب</label><select id="tac">'+ao+'</select>'+
'<div id="sg"><label>منبع</label><select id="ts">'+so+'</select></div>'+
'<div id="cg" style="display:none"><label>دسته</label><select id="tc2">'+co+'</select></div>'+
'<label>تاریخ شمسی</label><input id="tdt" value="'+J.todayStr()+'">'+
'<label>توضیح</label><input id="tds">'+
'<button class="btn b3" style="max-width:100%;margin-top:14px" onclick="saveTx()">💾 ذخیره</button>');
}
function toggleF(){
var t=document.getElementById('tt').value;
document.getElementById('sg').style.display=t==='income'?'block':'none';
document.getElementById('cg').style.display=t==='expense'?'block':'none';
}
function saveTx(){
var t=document.getElementById('tt').value;
var a=parseFloat(document.getElementById('ta').value);
if(!a||a<=0){toast('مبلغ درست وارد کن',true);return;}
var dt=document.getElementById('tdt').value.trim();
if(!dt){toast('تاریخ لازم',true);return;}
DB.data.transactions.push({
id:DB.data.nid.tx++,type:t,amount:a,
currency:document.getElementById('tc').value,
accountId:parseInt(document.getElementById('tac').value),
sourceId:t==='income'?parseInt(document.getElementById('ts').value):null,
categoryId:t==='expense'?parseInt(document.getElementById('tc2').value):null,
date:J.toG(dt),dateJalali:dt,
desc:document.getElementById('tds').value.trim()
});
DB.save();closeM();toast('✅ ثبت شد');refresh();
}
function delTx(id){if(!confirm('حذف شود؟'))return;DB.data.transactions=DB.data.transactions.filter(function(t){return t.id!==id;});DB.save();toast('🗑️ حذف شد');refresh();}

function rRem(){
var el=document.getElementById('reml');
if(!DB.data.reminders.length){el.innerHTML='<div class="empty">یادآوری نداری</div>';return;}
var ic={bill:'📄',installment:'💳',check:'📝',loan:'🏦',subscription:'🔄',other:'📌'};
el.innerHTML=DB.data.reminders.map(function(r){
var parts=r.dueJalali.split('/').map(Number);
var g=J.j2g(parts[0],parts[1],parts[2]);
var dd=new Date(g[0],g[1]-1,g[2]);
var td=new Date();td.setHours(0,0,0,0);
var days=Math.round((dd-td)/86400000);
var cls='',st='';
if(r.isPaid){cls='';st='✅ پرداخت شده';}
else if(days<0){cls='e';st='🔴 '+Math.abs(days)+' روز معوق';}
else if(days===0)st='🟡 امروز!';
else if(days<=3)st='🟡 '+days+' روز مانده';
else st='⏳ '+days+' روز';
return'<div class="tx '+cls+'">'+
'<div class="t1"><b>'+(ic[r.type]||'📌')+' '+r.title+'</b><span>'+r.dueJalali+'</span></div>'+
'<div class="t2">'+fmt(r.amount)+' '+r.currency+' | '+st+'</div>'+
'<div style="display:flex;gap:6px;margin-top:6px">'+
(!r.isPaid?'<button class="btn b3" style="max-width:100%;padding:6px;font-size:11px" onclick="payRem('+r.id+')">✅ پرداخت</button>':'')+
'<button class="btn b4" style="max-width:100%;padding:6px;font-size:11px" onclick="delRem('+r.id+')">🗑️ حذف</button>'+
'</div></div>';
}).join('');
}
function addRem(){
openM('<h3>➕ یادآور جدید</h3>'+
'<label>نوع</label><select id="rt"><option value="bill">📄 قبض</option><option value="installment">💳 قسط</option><option value="check">📝 چک</option><option value="loan">🏦 وام</option><option value="other">📌 سایر</option></select>'+
'<label>عنوان</label><input id="rti">'+
'<label>مبلغ</label><input id="ra" type="number" inputmode="numeric">'+
'<label>ارز</label><select id="rc"><option>IRT</option><option>IRR</option><option>USD</option></select>'+
'<label>سررسید شمسی</label><input id="rd" value="'+J.todayStr()+'">'+
'<label>تکرار</label><select id="rr"><option value="none">بدون</option><option value="monthly">ماهانه</option><option value="yearly">سالانه</option></select>'+
'<label>تعداد کل</label><input id="rt2" type="number" value="1">'+
'<button class="btn b3" style="max-width:100%;margin-top:14px" onclick="saveRem()">💾 ذخیره</button>');
}
function saveRem(){
var ti=document.getElementById('rti').value.trim();
if(!ti){toast('عنوان لازم',true);return;}
var du=document.getElementById('rd').value.trim();
if(!du){toast('سررسید لازم',true);return;}
DB.data.reminders.push({
id:DB.data.nid.rem++,
type:document.getElementById('rt').value,
title:ti,
amount:parseFloat(document.getElementById('ra').value)||0,
currency:document.getElementById('rc').value,
dueJalali:du,
repeat:document.getElementById('rr').value,
total:parseInt(document.getElementById('rt2').value)||1,
paid:0,isPaid:false
});
DB.save();closeM();toast('✅ ثبت شد');rRem();
}
function payRem(id){
var r=DB.data.reminders.find(function(x){return x.id===id;});
if(!r)return;
if(!confirm('پرداخت ثبت شود؟'))return;
r.paid=(r.paid||0)+1;
if(r.repeat==='none'||r.paid>=r.total){r.isPaid=true;}
else{
var p=r.dueJalali.split('/').map(Number);
if(r.repeat==='monthly'){p[1]++;if(p[1]>12){p[1]=1;p[0]++;}}
else if(r.repeat==='yearly')p[0]++;
r.dueJalali=p[0]+'/'+p2(p[1])+'/'+p2(p[2]);
}
DB.save();toast('✅ ثبت شد');rRem();
}
function delRem(id){if(!confirm('حذف؟'))return;DB.data.reminders=DB.data.reminders.filter(function(r){return r.id!==id;});DB.save();rRem();}

function rSet(){
document.getElementById('su').textContent=DB.data.currentUser?DB.data.currentUser.fullName:'—';
document.getElementById('acl').innerHTML=DB.data.accounts.map(function(a){return'<div class="row"><span>🏦 '+a.name+' ('+a.currency+')</span><button class="btn b4" style="max-width:60px;padding:4px 8px;font-size:11px" onclick="delAcc('+a.id+')">🗑️</button></div>';}).join('')||'<div class="empty">خالی</div>';
document.getElementById('scl').innerHTML=DB.data.sources.map(function(s){return'<div class="row"><span>📥 '+s.name+'</span><button class="btn b4" style="max-width:60px;padding:4px 8px;font-size:11px" onclick="delSrc('+s.id+')">🗑️</button></div>';}).join('')||'<div class="empty">خالی</div>';
document.getElementById('ccl').innerHTML=DB.data.categories.map(function(c){return'<div class="row"><span>📤 '+c.name+'</span><button class="btn b4" style="max-width:60px;padding:4px 8px;font-size:11px" onclick="delCat('+c.id+')">🗑️</button></div>';}).join('')||'<div class="empty">خالی</div>';
}

function delCat(id){if(!confirm('حذف؟'))return;DB.data.categories=DB.data.categories.filter(function(c){return c.id!==id;});DB.save();rSet();}

function expData(){
var b=new Blob([JSON.stringify(DB.data,null,2)],{type:'application/json'});
var a=document.createElement('a');
a.href=URL.createObjectURL(b);
a.download='moneymanager_'+new Date().toISOString().slice(0,10)+'.json';
a.click();
toast('✅ دانلود شد');
}
function impData(){
var inp=document.createElement('input');
inp.type='file';inp.accept='.json';
inp.onchange=function(e){
var f=e.target.files[0];if(!f)return;
var rd=new FileReader();
rd.onload=function(ev){
try{
var d=JSON.parse(ev.target.result);
if(!d.transactions)throw 0;
if(!confirm('جایگزین شود؟'))return;
DB.data=d;DB.save();location.reload();
}catch(err){toast('فایل نامعتبر',true);}
};
rd.readAsText(f);
};
inp.click();
}
function clrData(){if(!confirm('همه پاک شود؟'))return;if(!confirm('مطمئنی؟'))return;localStorage.removeItem(DB.key);location.reload();}
function openSync(){
openM('<h3>☁️ بکاپ</h3>'+
'<button class="btn b3" style="max-width:100%;margin-bottom:8px" onclick="expData();closeM()">📥 دانلود بکاپ</button>'+
'<button class="btn b5" style="max-width:100%" onclick="impData();closeM()">⬆️ بارگذاری</button>');
}

function refresh(){rDash();rTx();rRem();rSet();}

window.addEventListener('load',function(){
DB.load();
document.getElementById('ld').textContent='🗓️ '+J.full();

if(DB.data.currentUser){
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='block';
document.getElementById('hu').textContent=DB.data.currentUser.fullName;
document.getElementById('su').textContent=DB.data.currentUser.fullName;
refresh();
}
});
</script>
